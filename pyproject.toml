[build-system]
# swig 4.5 drops the PyInt_* macros used in SWIG/
requires = ["scikit-build-core>=0.11", "swig>=4.4,<4.6", "xad>=2.2,<2.3"]
build-backend = "scikit_build_core.build"

[project]
name = "QuantLibAAD"
# keep in sync with CMakeLists.txt
version = "1.44.0"
description = "Fast risks calculations in QuantLib"
readme = "Python/README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Auto Differentiation Dev Team", email = "dev@auto-differentiation.com" },
    { name = "QuantLib Team", email = "quantlib-users@lists.sourceforge.net" },
]
keywords = [
    "automatic-differentiation",
    "derivatives",
    "risk-management",
    "quant-finance",
    "greeks",
    "risks",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "License :: Other/Proprietary License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
]
# the binary module links xad's libxad and shares its Real type (same pybind11)
dependencies = ["xad>=2.2,<2.3"]

[project.urls]
Homepage = "https://www.xcelerit.com/xad/docs/"
Repository = "https://github.com/auto-differentiation/QuantLibAAD-Py"
Documentation = "https://www.xcelerit.com/xad/docs/quantlib-aad/python/"
Download = "https://pypi.org/project/QuantLibAAD/#files"
Tracker = "https://github.com/auto-differentiation/QuantLibAAD-Py/issues"

[dependency-groups]
test = ["pytest"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.18"
build.verbose = true
# the package is installed by CMake (Python/QuantLibAAD/CMakeLists.txt)
wheel.packages = []
install.components = ["python"]
# submodule parts not needed to build
sdist.exclude = [
    ".github",
    "binder",
    "build",
    "lib/QuantLib/Docs",
    "lib/QuantLib/Examples",
    "lib/QuantLib/test-suite",
    "lib/QuantLib/fuzz-test-suite",
    "lib/pybind11/docs",
    "lib/pybind11/tests",
]

[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
skip = ["cp3??t-*"]  # no free-threaded builds
archs = ["native"]  # one arch per runner
build-verbosity = 1
# QuantLib (with QuantLibAAD) is built once per platform and reused by all
# wheels through QLR_QUANTLIB_PREFIX, against the XAD of a xad package that
# build-quantlib.cmake installs (XAD_REQUIREMENT)
before-all = "cmake \"-DXAD_REQUIREMENT=xad>=2.2,<2.3\" -DPREFIX={project}/build/quantlib-prefix -P {project}/tools/build-quantlib.cmake"
config-settings = { "cmake.define.QLR_QUANTLIB_PREFIX" = "{project}/build/quantlib-prefix" }
test-groups = ["test"]
# importlib mode tests the installed package; Python/test would clash with the stdlib test package
test-command = "pytest -p no:cacheprovider --import-mode=importlib {project}/Python/test"

# libxad comes from the xad package (rpath to xad/lib), never bundled
[tool.cibuildwheel.linux]
repair-wheel-command = "auditwheel repair --exclude libxad.so -w {dest_dir} {wheel}"

[tool.cibuildwheel.windows]
repair-wheel-command = "pip install delvewheel && delvewheel repair --exclude xad.dll -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} --ignore-missing-dependencies --exclude libxad.dylib -w {dest_dir} -v {wheel}"
# one target for the QuantLib build (before-all) and all wheels (raised to 11.0 on arm64)
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }
