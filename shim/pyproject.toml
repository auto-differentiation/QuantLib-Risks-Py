# QuantLib-Risks is now QuantLibAAD: this distribution only installs QuantLibAAD
# and keeps `import QuantLib_Risks` working, with a DeprecationWarning.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "QuantLib-Risks"
# keep in sync with ../pyproject.toml
version = "1.44.0"
description = "Deprecated: QuantLib-Risks is now QuantLibAAD"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Auto Differentiation Dev Team", email = "dev@auto-differentiation.com" },
]
classifiers = [
    "Development Status :: 7 - Inactive",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
]
dependencies = ["QuantLibAAD==1.44.*"]

[project.urls]
Homepage = "https://pypi.org/project/QuantLibAAD"
Repository = "https://github.com/auto-differentiation/QuantLibAAD-Py"

[tool.hatch.build.targets.wheel]
packages = ["QuantLib_Risks"]
